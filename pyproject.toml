[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trialsight-lite"
version = "0.4.0"
description = "Retrospective analytics on public ClinicalTrials.gov metadata"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Streamlit requires PyArrow. Kept optional so the data/analysis pipeline never needs PyArrow.
app = ["streamlit>=1.35"]
docs = ["matplotlib>=3.8"]

[project.scripts]
trialsight = "trialsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
